<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2b"><meta name="description" content="Τοπική αποθήκευση θέσης στάθμευσης"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><title>Το Πάρκινγκ μου</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101b2b;color:#f7fafc}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.app{width:min(100%,480px)}header{text-align:center;margin-bottom:24px}h1{font-size:1.8rem;margin:12px 0 4px}header p,.muted{color:#aab9ce}.panel{background:#1a2a40;border:1px solid #31445e;border-radius:20px;padding:24px;text-align:center}.status{display:inline-block;background:#27445d;border-radius:30px;padding:7px 14px;font-size:.9rem;margin-bottom:14px}.position{font-size:1.12rem;font-weight:700;overflow-wrap:anywhere}.date{font-size:.9rem;color:#b6c6d9;margin-top:9px}.actions{display:grid;gap:12px;margin-top:18px}button{cursor:pointer;width:100%;padding:17px;border:0;border-radius:14px;font-weight:750;font-size:1rem;color:white;background:#2673ed}button.secondary{background:#253e5b;border:1px solid #48617d}button:disabled{opacity:.5;cursor:not-allowed}button[hidden]{display:none}.note{font-size:.76rem;color:#859ab4;text-align:center;line-height:1.5;margin-top:18px}
#message{color:#d9e8fa;text-align:center;font-size:.85rem;margin-top:9px}
#message:empty{display:none}
#capture-status{color:#a8f2cb;text-align:center;font-size:.91rem;font-weight:650;margin-top:12px}
#capture-status:empty{display:none}
.gps-progress{display:flex;align-items:center;justify-content:center;gap:13px;margin:18px 0 2px;color:#b8cce5;font-size:.9rem;font-weight:600}
.gps-progress[hidden]{display:none}
.gps-ring{width:66px;height:66px;display:grid;place-items:center;border-radius:50%;padding:5px;background:conic-gradient(#65dfb0 0deg,#2a435e 0deg)}
.gps-inner{width:100%;height:100%;display:grid;place-items:center;border-radius:50%;background:#101b2b;font-size:1.4rem;font-weight:800;color:#f7fafc;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){.gps-ring{transition:none}}</style></head><body><main class="app"><header><div aria-hidden="true" style="font-size:3rem">🚗</div><h1>Το Πάρκινγκ μου</h1></header><section class="panel" aria-live="polite"><div class="status" id="status">Δεν υπάρχει αποθηκευμένη θέση</div><div class="position" id="position">Πάτησε «Αποθήκευση θέσης» όταν παρκάρεις.</div><div class="date" id="date"></div></section><div class="actions"><button id="save">📍 Αποθήκευση θέσης</button><button class="secondary" id="retry" hidden>↻ Επανάληψη εύρεσης οδού</button><button class="secondary" id="map" disabled>🗺️ Προβολή χάρτη</button><button class="secondary" id="navigate" disabled>➤ Πλοήγηση στο αυτοκίνητο</button></div><div class="gps-progress" id="gps-progress" hidden><div class="gps-ring" id="gps-ring"><div class="gps-inner" id="gps-seconds">5</div></div><span>Εντοπισμός θέσης…</span></div><div id="capture-status" role="status" aria-live="polite"></div><div id="message" role="status" aria-live="polite"></div><p class="note">Η θέση μένει στο κινητό. Η εύρεση οδού γίνεται online (© OpenStreetMap contributors).</p></main><script>(()=>{'use strict';const KEY='parking.saved.v1',$=id=>document.getElementById(id);let saved=null;try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(Number.isFinite(v.lat)&&Number.isFinite(v.lon)&&Number.isFinite(v.timestamp)&&Math.abs(v.lat)<=90&&Math.abs(v.lon)<=180)saved=v}}catch(e){$('message').textContent='Αδυναμία ανάγνωσης προηγούμενης θέσης.'}function render(){
  $('map').disabled=$('navigate').disabled=!saved;
  const unresolved=!!saved && !saved.address;
  $('retry').hidden=!saved || !saved.addressLookedUp || !unresolved;
  $('retry').disabled=lookingUp;
  if(saved){
    $('status').textContent='✓ Αποθηκευμένη θέση';
    $('position').textContent=saved.address || (lookingUp?'Εύρεση οδού…':(saved.addressLookedUp?'Άγνωστη οδός':'Η θέση έχει αποθηκευτεί'));
    $('date').textContent=new Intl.DateTimeFormat('el-GR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(saved.timestamp));
  }else{
    $('status').textContent='Δεν υπάρχει αποθηκευμένη θέση';
    $('position').textContent='Πάτησε «Αποθήκευση θέσης».';
    $('date').textContent='';
  }
}
function stillCurrent(record){
 return saved && saved.timestamp===record.timestamp && saved.lat===record.lat && saved.lon===record.lon;
}
function streetLabel(road,house,city,record){
  if(!road)return '';
  const precise=Number.isFinite(record.accuracy)&&record.accuracy<=40;
  return 'Πιθανή οδός: '+road+(precise&&house?' '+house:'')+(city?', '+city:'');
}
function photonLabel(data,record){
  const features=Array.isArray(data?.features)?data.features:[];
  const match=features.find(f=>f?.properties && typeof f.properties.street==='string' && f.properties.street.trim()) ||
    features.find(f=>f?.properties?.osm_key==='highway' && typeof f.properties.name==='string' && f.properties.name.trim());
  const p=match?.properties||{};
  const road=String(p.street || (p.osm_key==='highway'?p.name:'') || '').trim();
  return streetLabel(road,String(p.housenumber||'').trim(),String(p.city||p.locality||p.district||'').trim(),record);
}
function nominatimLabel(data,record){
  const a=data?.address||{};
  const road=String(a.road||a.pedestrian||a.residential||a.living_street||a.footway||a.path||'').trim();
  return streetLabel(road,String(a.house_number||'').trim(),String(a.city||a.town||a.village||a.municipality||'').trim(),record);
}
async function requestJson(url,timeout=9000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const response=await fetch(url,{signal:controller.signal,cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    return await response.json();
  }finally{clearTimeout(timer)}
}
let lookingUp=false;
async function resolveAddress(record){
  if(!record || record.addressLookedUp || lookingUp)return;
  if(!navigator.onLine){
    $('message').textContent='Εκτός σύνδεσης: η αποθηκευμένη θέση είναι διαθέσιμη.';
    return;
  }
  lookingUp=true;render();
  $('message').textContent='';
  let address='';
  try{
    const url='https://photon.komoot.io/reverse?lat='+encodeURIComponent(record.lat)+'&lon='+encodeURIComponent(record.lon)+'&lang=el&limit=5';
    address=photonLabel(await requestJson(url,8000),record);
  }catch(error){/* Try second provider if Photon fails or times out. */}
  if(!address){
    try{
      const url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=el&lat='+
        encodeURIComponent(record.lat)+'&lon='+encodeURIComponent(record.lon);
      address=nominatimLabel(await requestJson(url,10000),record);
    }catch(error){/* Keep GPS coordinates if both services fail. */}
  }
  lookingUp=false;
  if(stillCurrent(record)){
    saved.address=address;
    saved.addressLookedUp=true; // Prevent automatic repeated queries on every launch.
    try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(error){}
    render();
    $('message').textContent=address?
      '':
      'Δεν βρέθηκε οδός — δοκίμασε ξανά.';
  }else if(saved && !saved.addressLookedUp){
    resolveAddress(saved);
  }
}
render();
if(saved && !saved.addressLookedUp)resolveAddress(saved);
$('retry').addEventListener('click',()=>{
  if(!saved || lookingUp)return;
  saved.addressLookedUp=false;
  resolveAddress(saved);
});
$('save').addEventListener('click',()=>{
  if(!isSecureContext){$('capture-status').textContent='Το GPS απαιτεί HTTPS.';return}
  if(!navigator.geolocation){$('capture-status').textContent='Δεν υποστηρίζεται το GPS.';return}
  const button=$('save'),progress=$('gps-progress'),ring=$('gps-ring'),seconds=$('gps-seconds');
  button.disabled=true;
  $('capture-status').textContent='';
  $('message').textContent='';
  progress.hidden=false;
  const start=performance.now();
  let best=null,finished=false,watchId=null,timer=null,animationId=null;

  function animate(now){
    if(finished)return;
    const elapsed=Math.max(0,Math.min(5000,now-start));
    const angle=elapsed/5000*360;
    ring.style.background='conic-gradient(#65dfb0 '+angle+'deg,#2a435e '+angle+'deg)';
    seconds.textContent=String(Math.max(1,Math.ceil((5000-elapsed)/1000)));
    animationId=requestAnimationFrame(animate);
  }
  seconds.textContent='5';
  ring.style.background='conic-gradient(#65dfb0 0deg,#2a435e 0deg)';
  animationId=requestAnimationFrame(animate);
  function stop(){
    if(finished)return false;
    finished=true;
    clearTimeout(timer);
    cancelAnimationFrame(animationId);
    if(watchId!==null)navigator.geolocation.clearWatch(watchId);
    progress.hidden=true;
    button.disabled=false;
    return true;
  }
  function finish(){
    if(!stop())return;
    if(!best){
      $('capture-status').textContent='Δεν βρέθηκε θέση. Η προηγούμενη παραμένει.';
      return;
    }
    const value={lat:best.lat,lon:best.lon,accuracy:best.accuracy,timestamp:Date.now(),address:'',addressLookedUp:false};
    try{
      localStorage.setItem(KEY,JSON.stringify(value));
      saved=value;render();
      $('capture-status').textContent='✓ Αποθηκεύτηκε — μπορείς να κλειδώσεις.';
      resolveAddress(value);
    }catch(error){
      $('capture-status').textContent='Η αποθήκευση απέτυχε.';
    }
  }
  // Stop after five seconds, but accept a sufficiently good fix sooner.
  timer=setTimeout(finish,5000);
  try{
    watchId=navigator.geolocation.watchPosition(
      position=>{
        if(finished)return;
        const c=position.coords;
        if(!Number.isFinite(c.latitude)||!Number.isFinite(c.longitude)||Math.abs(c.latitude)>90||Math.abs(c.longitude)>180)return;
        const accuracy=Number.isFinite(c.accuracy)?c.accuracy:null;
        const candidate={lat:c.latitude,lon:c.longitude,accuracy};
        if(!best || (accuracy!==null&&(best.accuracy===null||accuracy<best.accuracy)))best=candidate;
        if(accuracy!==null && accuracy<=35)finish();
      },
      error=>{
        if(finished)return;
        if(error.code===1 && stop())$('capture-status').textContent='Δεν δόθηκε άδεια τοποθεσίας.';
      },
      {enableHighAccuracy:true,timeout:5000,maximumAge:10000}
    );
    if(finished && watchId!==null)navigator.geolocation.clearWatch(watchId);
  }catch(error){
    if(stop())$('capture-status').textContent='Δεν ήταν δυνατή η λήψη GPS.';
  }
});
$('map').addEventListener('click',()=>{if(!saved)return;const {lat,lon}=saved;window.open('https://www.openstreetmap.org/?mlat='+encodeURIComponent(lat)+'&mlon='+encodeURIComponent(lon)+'#map=18/'+lat+'/'+lon,'_blank','noopener,noreferrer')});$('navigate').addEventListener('click',()=>{if(!saved)return;window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(saved.lat+','+saved.lon),'_blank','noopener,noreferrer')});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))})();</script></body></html>
