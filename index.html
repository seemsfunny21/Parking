<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#081629">
  <meta name="description" content="Το Πάρκινγκ μου - εύκολη αποθήκευση θέσης αυτοκινήτου">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <title>Το Πάρκινγκ μου</title>
  <style>
    :root{
      --bg:#071426;
      --bg2:#0a1d35;
      --panel:rgba(18,39,67,.84);
      --panel-2:rgba(20,48,84,.92);
      --edge:rgba(116,165,255,.24);
      --edge-strong:rgba(90,160,255,.48);
      --text:#f6fbff;
      --sub:#aec6e6;
      --blue:#1a7dff;
      --blue2:#34a0ff;
      --green:#1fba72;
      --green2:#3ae091;
      --shadow:0 20px 50px rgba(0,0,0,.34);
      --radius:24px;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:
      radial-gradient(circle at 50% 8%, rgba(42,112,255,.18), transparent 26%),
      radial-gradient(circle at 50% 100%, rgba(12,85,255,.15), transparent 30%),
      linear-gradient(180deg,#04101d 0%, #081629 38%, #071426 100%);
      color:var(--text);
    }
    body{padding:20px 16px 28px}
    .app{max-width:430px;margin:0 auto}
    .hero{text-align:center;padding-top:2px;margin-bottom:10px}
    .car-glow{
      width:120px;height:74px;margin:6px auto 10px;position:relative;
      display:grid;place-items:center;
    }
    .car-glow::before{
      content:"";position:absolute;inset:auto 10px 8px;height:18px;border-radius:999px;
      background:radial-gradient(circle at center, rgba(50,160,255,.85), rgba(50,160,255,.18) 55%, transparent 72%);
      filter:blur(2px);
    }
    .car-emoji{font-size:3.4rem;position:relative;z-index:1;filter:drop-shadow(0 0 10px rgba(58,148,255,.35));}

    .panel{
      background:linear-gradient(180deg, rgba(18,37,64,.95), rgba(12,29,52,.88));
      border:1px solid var(--edge);
      border-radius:18px;
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.03);
      padding:18px 18px 16px;
      position:relative;overflow:hidden;
      backdrop-filter:blur(10px);
      text-align:center;
    }
    .panel::after{
      content:"";position:absolute;right:-20px;bottom:-28px;width:210px;height:140px;opacity:.34;
      background:
        linear-gradient(125deg, transparent 0 28%, rgba(86,140,230,.9) 28% 30%, transparent 30% 48%, rgba(86,140,230,.9) 48% 50%, transparent 50% 68%, rgba(86,140,230,.9) 68% 70%, transparent 70%),
        radial-gradient(circle at 36% 56%, rgba(68,160,255,.95) 0 6px, rgba(68,160,255,.2) 7px 22px, transparent 23px);
      transform:rotate(-6deg);
      pointer-events:none;
    }
    .status-chip{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 18px;border-radius:999px;
      background:linear-gradient(180deg, rgba(47,143,255,.95), rgba(15,96,212,.96));
      box-shadow:inset 0 0 0 1px rgba(160,218,255,.45), 0 8px 30px rgba(17,112,255,.24);
      font-weight:760;font-size:1rem;
    }
    .status-chip .check{font-size:1.7rem;line-height:1;margin-top:-2px}.status-chip.empty{background:linear-gradient(180deg,#294562,#1a344e);box-shadow:inset 0 0 0 1px rgba(130,170,215,.3)}
    .place{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;margin:17px 0 12px;position:relative;z-index:1;text-align:center}
    .pin{font-size:2.5rem;line-height:1;color:#3d8fff;filter:drop-shadow(0 0 10px rgba(63,143,255,.3))}
    .place-name{font-size:1.85rem;line-height:1.08;font-weight:800;letter-spacing:-.03em;word-break:break-word}
    .meta{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;color:#d6e6fa;font-size:1.05rem;position:relative;z-index:1;text-align:center}
    .meta span{display:inline-flex;align-items:center;gap:8px;opacity:.96}
    .meta i{font-style:normal;font-size:1.1rem}

    .progress-block{display:grid;place-items:center;padding:20px 0 16px}.progress-block.idle{display:none}.big-progress[hidden]{display:none}
    .progress-wrap{display:grid;place-items:center;gap:10px}
    .big-progress{
      width:164px;height:164px;border-radius:50%;display:grid;place-items:center;position:relative;
      background:conic-gradient(var(--blue2) 0deg, rgba(74,123,191,.22) 0deg);
      box-shadow:0 0 0 10px rgba(31,80,151,.18), 0 0 80px rgba(24,100,255,.16);
    }
    .big-progress::before{
      content:"";position:absolute;inset:14px;border-radius:50%;
      background:radial-gradient(circle at 50% 30%, #0e223d, #081629 70%);
      box-shadow:inset 0 0 0 1px rgba(127,175,255,.12);
    }
    .big-progress-inner{position:relative;z-index:1;text-align:center}
    .big-progress-top{font-size:1.35rem;line-height:1;margin-bottom:6px}
    .big-progress-seconds{font-size:3.3rem;font-weight:820;line-height:1.02}
    .progress-label{color:var(--sub);font-size:1.02rem;text-align:center;min-height:1.4em}
    .progress-idle{display:none}

    .actions{display:grid;gap:14px;margin-top:12px}
    button{
      width:100%;border:0;border-radius:24px;padding:0;cursor:pointer;color:var(--text);
      font:inherit;transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    }
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.56;cursor:not-allowed}
    .primary-btn{
      background:linear-gradient(180deg, #2f8dff, #136df0);
      box-shadow:0 18px 42px rgba(3,34,92,.34), inset 0 0 0 1px rgba(180,221,255,.24);
      min-height:92px;
      display:grid;grid-template-columns:1fr;align-items:stretch;overflow:hidden;
    }
    .primary-main{display:flex;align-items:center;justify-content:center;gap:14px;padding:0 18px;font-size:1.1rem;font-weight:800}
    .primary-main .icon{font-size:2.1rem;line-height:1}
    .secondary{
      background:linear-gradient(180deg, rgba(31,59,95,.96), rgba(21,43,72,.96));
      border:1px solid rgba(122,164,226,.24);
      min-height:76px;
      box-shadow:0 14px 30px rgba(0,0,0,.22);
      display:flex;align-items:center;justify-content:center;gap:16px;font-weight:780;font-size:1.02rem;
    }
    .secondary .icon{font-size:2rem;line-height:1}

    .retry{background:transparent;color:var(--sub);border:1px dashed rgba(125,173,255,.24);min-height:54px;font-size:.95rem;display:none}
    .retry.show{display:flex;align-items:center;justify-content:center}

    .capture-status,.message{min-height:1.3em;text-align:center}
    .capture-status{margin-top:16px;color:#a7d8ff;font-weight:700;font-size:.95rem}
    .message{margin-top:6px;color:#b9cdec;font-size:.92rem}
    .message:empty,.capture-status:empty{display:none}

    @media (max-width:390px){
      .place-name{font-size:1.62rem}
      .meta{font-size:.97rem}
      .primary-main{font-size:1.02rem}
    }
  
    /* Premium mobile consistency: clearer keyboard/touch states, no duplicate UI. */
    :is(.primary-btn,.secondary,.retry){
      touch-action:manipulation;
      -webkit-tap-highlight-color:transparent;
      transition:filter .16s ease,box-shadow .16s ease,transform .16s ease;
    }
    :is(button,a):focus-visible{
      outline:3px solid #92d8ff;
      outline-offset:3px;
    }
    .panel:focus-within{
      border-color:rgba(130,201,255,.54);
      box-shadow:var(--shadow),0 0 0 1px rgba(130,201,255,.12);
    }
    @media(hover:hover){
      :is(.primary-btn,.secondary,.retry):not(:disabled):hover{filter:brightness(1.08)}
    }
    @media(prefers-reduced-motion:reduce){
      :is(.primary-btn,.secondary,.retry){transition:none!important}
    }

  
    /* Premium illustrated header, replacing the old car emoji. */
    body{padding-top:10px}
    .app .hero{padding:0;margin:0 0 12px}
    .parking-hero-art{
      display:block;width:100%;height:auto;max-height:145px;
      border:1px solid rgba(101,179,255,.32);border-radius:17px;
      object-fit:contain;background:#071736;
      box-shadow:0 12px 32px rgba(0,5,18,.35);
    }
    @media(max-width:375px){.app .hero{margin-bottom:9px}.parking-hero-art{border-radius:13px}}
    @media(max-height:620px){.parking-hero-art{max-height:105px;object-fit:fill}}

  
    /* Shared premium hero height — identical to Reminders and Routes. */
    @media(max-width:760px){
      .parking-hero-art{
        width:100%!important;
        height:clamp(74px,12dvh,112px)!important;
        max-height:none!important;
        object-fit:cover!important;
        object-position:center!important;
      }
    }
    @media(min-width:761px){
      .parking-hero-art{
        width:100%!important;
        height:150px!important;
        max-height:none!important;
        object-fit:cover!important;
        object-position:center!important;
      }
    }

  
/* Applications: same 12px inset, 12px radius, 10px after-banner gap. */
@media(max-width:760px){
 body{padding-top:12px!important;padding-left:12px!important;padding-right:12px!important}
 .app .hero{margin:0 0 10px!important;padding:0!important}
 .parking-hero-art{border-radius:12px!important}
}


/* Five most recent parking locations, collapsed until requested. */
.parking-history{margin:14px 0 8px;border:1px solid var(--edge);background:linear-gradient(180deg,rgba(17,39,72,.95),rgba(10,29,54,.92));border-radius:16px;overflow:hidden;box-shadow:0 8px 20px rgba(0,5,18,.16)}
.parking-history[hidden]{display:none!important}
.parking-history-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:11px 14px;color:#fff;font-size:14px;font-weight:800;text-align:left;cursor:pointer;list-style:none}
.parking-history-toggle::-webkit-details-marker{display:none}
.parking-history-toggle::after{content:"⌄";font-size:18px;color:#9acfff;transition:transform .18s}
.parking-history[open] .parking-history-toggle::after{transform:rotate(180deg)}
.parking-history-count{margin-left:auto;white-space:nowrap;font-size:11px;color:#a6ceff;border:1px solid rgba(112,168,243,.38);background:rgba(35,77,133,.46);border-radius:999px;padding:3px 8px}
.parking-history-hint{margin:0 13px 10px;text-align:left;font-size:11px;color:var(--sub);line-height:1.4}
.parking-history-list{display:grid;gap:8px;padding:0 10px 12px}
.parking-history-item{background:rgba(32,71,115,.72);border:1px solid rgba(111,165,235,.35);border-radius:12px;padding:10px 11px;text-align:left;min-width:0}
.parking-history-item.is-current{border-color:rgba(68,198,162,.65)}
.parking-history-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.parking-history-date{font-size:12px;font-weight:800;color:#f0f8ff}
.parking-history-active{font-size:10px;color:#b3f9e4;font-weight:700;white-space:nowrap}
.parking-history-place{font-size:12px;color:#d7e8fc;margin:5px 0 3px;overflow-wrap:anywhere}
.parking-history-coords{font-size:10px;color:#aac2e0;font-variant-numeric:tabular-nums}
.parking-history-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.parking-history-actions button{min-height:38px;padding:8px 4px;font-size:12px;font-weight:800;color:#fff;background:#255c99;border:1px solid #6098d6;border-radius:9px;cursor:pointer}
.parking-history-actions button:focus-visible,.parking-history-toggle:focus-visible{outline:2px solid #8cd4ff;outline-offset:2px}
@media(max-width:360px){.parking-history-item{padding:9px}.parking-history-actions button{font-size:11px}}


/* Medium-premium Parking UI: four unified action cards in a 2x2 grid. */
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:14px 0 0}
.actions .action-tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  min-width:0;min-height:104px;padding:12px 9px;text-align:center;
  border-radius:16px;font-size:.93rem;font-weight:780;line-height:1.23;
  background:linear-gradient(155deg,rgba(31,67,111,.96),rgba(14,37,70,.98));
  border:1px solid rgba(112,172,249,.39);
  box-shadow:inset 0 1px 0 rgba(223,243,255,.09),0 10px 25px rgba(0,7,29,.24);
}
.actions .action-tile .primary-main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:0;font-size:inherit;font-weight:inherit}
.actions .action-tile .icon{font-size:1.85rem;line-height:1.07}
.actions .action-tile .tile-count{font-size:.71rem;font-weight:650;color:#a9cfff}
.actions .action-tile.tile-save{
  background:linear-gradient(160deg,#2387f9,#1155b8);border-color:rgba(167,222,255,.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.23),0 7px 23px rgba(12,107,242,.27);
}
.actions .action-tile.tile-history[aria-expanded="true"]{
  border-color:rgba(131,211,255,.8);
  background:linear-gradient(150deg,rgba(36,91,161,.98),rgba(17,54,104,.98));
  box-shadow:0 0 0 1px rgba(43,152,249,.16),0 6px 20px rgba(31,113,232,.18);
}
.actions .action-tile:disabled{opacity:.53;box-shadow:none}
.retry{margin-top:10px;border-radius:14px}
/* Matching five-location history, with blue—not green—current-place accent. */
.parking-history{
  margin:12px 0 8px;padding:14px 12px 12px;text-align:center;
  background:linear-gradient(165deg,rgba(18,41,73,.97),rgba(11,31,59,.98));
  border:1px solid rgba(116,174,248,.33);border-radius:20px;
  box-shadow:0 12px 27px rgba(0,8,29,.22);
}
.parking-history[hidden],.parking-history.is-collapsed{display:none!important}
.parking-history-title{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
.parking-history-title h2{margin:0;font-size:1rem;color:#fff}
.parking-history-count{margin:0;white-space:nowrap;font-size:.7rem;color:#c8e5ff;border:1px solid rgba(116,174,248,.45);background:rgba(37,88,151,.48);border-radius:999px;padding:3px 9px}
.parking-history-hint{margin:7px 2px 12px;text-align:center;font-size:.75rem;color:var(--sub);line-height:1.4}
.parking-history-list{display:grid;gap:10px;padding:0}
.parking-history-item{
  background:linear-gradient(155deg,rgba(32,72,118,.86),rgba(19,50,90,.94));
  border:1px solid rgba(110,167,240,.38);border-radius:17px;padding:12px;min-width:0;text-align:center;
  box-shadow:inset 0 1px 0 rgba(235,245,255,.06),0 5px 14px rgba(0,10,33,.14);
}
.parking-history-item.is-current{border-color:rgba(110,192,255,.78);box-shadow:0 0 16px rgba(30,132,245,.13)}
.parking-history-head{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
.parking-history-date{font-size:.78rem;font-weight:800;color:#f1f8ff}
.parking-history-active{font-size:.66rem;font-weight:750;color:#e2f5ff;background:rgba(31,116,217,.45);border:1px solid rgba(126,201,255,.46);border-radius:999px;padding:3px 8px}
.parking-history-place{font-size:.88rem;font-weight:720;color:#f3f9ff;margin:8px 0 5px;overflow-wrap:anywhere}
.parking-history-coords{font-size:.72rem;color:#adc9e9;font-variant-numeric:tabular-nums}
.parking-history-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
.parking-history-actions button{min-height:40px;padding:9px 5px;border-radius:12px;font-size:.78rem;font-weight:800;color:#fff;background:linear-gradient(155deg,#2c6ab5,#1e4e8d);border:1px solid rgba(129,194,255,.46)}
@media(hover:hover){.actions .action-tile:not(:disabled):hover{filter:brightness(1.08)}}
@media(max-width:360px){.actions{gap:9px}.actions .action-tile{min-height:94px;font-size:.85rem;padding:9px 5px}.parking-history-item{padding:10px}.parking-history-actions button{font-size:.73rem}}
@media(prefers-reduced-motion:reduce){.actions .action-tile{transition:none!important}}

</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoS3aFQ9GQm5B4=" crossorigin="">
<style>
.actions{grid-template-columns:repeat(2,minmax(0,1fr))}
.actions .action-tile{min-height:70px}
.live-map-shell{margin-top:12px;border:1px solid rgba(112,172,249,.39);border-radius:17px;overflow:hidden;background:#102b48;position:relative}
#live-map{height:max(310px,calc(100dvh - 480px));min-height:310px;width:100%;z-index:0}
.map-overlay{position:absolute;bottom:12px;left:10px;right:10px;z-index:500;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.map-overlay button{pointer-events:auto;width:auto;min-height:40px;padding:8px 12px;border-radius:12px;background:#123b71e8;border:1px solid #7ab8f4;font-size:13px;font-weight:750}
.map-hint{font-size:12px;color:#b9d8fb;text-align:center;padding:10px}
.leaflet-container{font-family:inherit}
</style></head>
<body>
  <main class="app">
    <header class="hero" aria-label="Parking">
      <img class="parking-hero-art" src="./hero-banner.webp" alt="Parking — η θέση του αυτοκινήτου σου" width="900" height="300" decoding="async">
    </header>

    <section class="panel" aria-live="polite">
      <div class="status-chip"><span class="check">✓</span><span id="status">Αποθηκευμένη θέση</span></div>
      <div class="place">
        <div class="pin" aria-hidden="true">📍</div>
        <div class="place-name" id="position">Πάτησε «Αποθήκευση θέσης».</div>
      </div>
      <div class="meta">
        <span><i>📅</i><span id="date">—</span></span>
      </div>
    </section>

    <section class="progress-block idle" id="progress-block">
      <div class="progress-wrap">
        <div class="big-progress" id="big-progress" hidden>
          <div class="big-progress-inner">
            <div class="big-progress-top">📡</div>
            <div class="big-progress-seconds" id="big-seconds">5</div>
          </div>
        </div>
        <div class="progress-label" id="progress-label"></div>
      </div>
    </section>

    <div class="actions" role="group" aria-label="Ενέργειες πάρκινγκ">
      <button id="save" class="action-tile tile-save primary-btn" type="button">
        <span class="primary-main"><span class="icon" aria-hidden="true">📍</span><span id="save-label">Αποθήκευση θέσης</span></span>
      </button>
      <button id="history-toggle" class="action-tile tile-history secondary" type="button" disabled aria-controls="history-panel" aria-expanded="false">
        <span class="icon" aria-hidden="true">🕘</span><span>Ιστορικό θέσεων</span><span class="tile-count" id="history-tile-count">0/5</span>
      </button>
    </div>
    <section class="live-map-shell" aria-label="Ζωντανός χάρτης πάρκινγκ"><div id="live-map"></div><div id="map-hint" class="map-hint" hidden>Ο χάρτης χρειάζεται σύνδεση στο διαδίκτυο.</div><div class="map-overlay"><button id="locate-me" type="button">◎ Η θέση μου</button><button id="route-to-car" type="button">➤ Διαδρομή</button></div></section>
    <button id="retry" class="retry" type="button">↻ Επανάληψη εύρεσης οδού</button>

    <section class="parking-history is-collapsed" id="history-panel" aria-label="Ιστορικό θέσεων" hidden>
      <div class="parking-history-title"><h2>Ιστορικό θέσεων</h2><span class="parking-history-count" id="history-count">0/5</span></div>
      <p class="parking-history-hint">Οι 5 τελευταίες αποθηκευμένες θέσεις σε αυτή τη συσκευή.</p>
      <div class="parking-history-list" id="history-list"></div>
    </section>

    <div class="capture-status" id="capture-status" role="status" aria-live="polite"></div>
    <div class="message" id="message" role="status" aria-live="polite"></div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
  (()=>{
    'use strict';
    const APP_BUILD='parking-v18';
    const KEY='parking.saved.v1';
    const HISTORY_KEY='parking.history.v1', HISTORY_LIMIT=5;
    const $=id=>document.getElementById(id);
    let saved=null, history=[], lookingUp=false, historyExpanded=false;
    let liveMap=null,carMarker=null,userMarker=null,userAccuracy=null,geoWatch=null,lastUserPosition=null,mapFitted=false;
    function refreshMap(){
      if(!liveMap)return;
      if(saved){
        const point=[saved.lat,saved.lon];
        if(!carMarker)carMarker=L.marker(point).addTo(liveMap).bindPopup('🚗 Αποθηκευμένο πάρκινγκ');
        else carMarker.setLatLng(point);
        if(!mapFitted){liveMap.setView(point,17);mapFitted=true;}
      }else if(carMarker){liveMap.removeLayer(carMarker);carMarker=null;}
      if(saved&&lastUserPosition&&mapFitted){
        // Keep both markers visible on initial fix, without repeatedly overriding manual panning.
        if(!liveMap._shownBoth){liveMap.fitBounds(L.latLngBounds([saved.lat,saved.lon],[lastUserPosition.lat,lastUserPosition.lon]).pad(.3),{maxZoom:17});liveMap._shownBoth=true;}
      }
    }
    function initMap(){
      if(typeof L==='undefined'){$('map-hint').hidden=false;return;}
      liveMap=L.map('live-map',{zoomControl:true}).setView([39.665,20.853],13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(liveMap);
      refreshMap();
      if(!navigator.geolocation){$('locate-me').textContent='GPS μη διαθέσιμο';return;}
      geoWatch=navigator.geolocation.watchPosition(pos=>{
        const c=pos.coords;lastUserPosition={lat:c.latitude,lon:c.longitude};
        const ll=[c.latitude,c.longitude];
        if(!userMarker)userMarker=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#218cff',fillOpacity:1}).addTo(liveMap).bindPopup('Η θέση μου');
        else userMarker.setLatLng(ll);
        if(userAccuracy)liveMap.removeLayer(userAccuracy);
        userAccuracy=L.circle(ll,{radius:Math.max(1,c.accuracy||1),stroke:false,fillColor:'#238bff',fillOpacity:.12,interactive:false}).addTo(liveMap);
        if(!saved&&!mapFitted){liveMap.setView(ll,17);mapFitted=true;}
        refreshMap();
      },()=>{$('locate-me').textContent='◎ Ενεργοποίηση GPS';},{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
      document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>liveMap?.invalidateSize(),150);});
      $('locate-me').addEventListener('click',()=>{
        if(lastUserPosition)liveMap.setView([lastUserPosition.lat,lastUserPosition.lon],17);
        else navigator.geolocation.getCurrentPosition(p=>liveMap.setView([p.coords.latitude,p.coords.longitude],17),()=>{$('locate-me').textContent='Άδεια GPS απαιτείται';},{enableHighAccuracy:true});
      });
      $('route-to-car').addEventListener('click',()=>{if(saved)navigateTo(saved);});
      setTimeout(()=>liveMap.invalidateSize(),250);
    }

    function validPosition(v){
      return v && typeof v==='object' && Number.isFinite(v.lat) && Number.isFinite(v.lon)
        && Math.abs(v.lat)<=90 && Math.abs(v.lon)<=180 && Number.isFinite(v.timestamp)
        && Number.isFinite(new Date(v.timestamp).getTime());
    }
    function sameRecord(a,b){
      return !!a && !!b && a.timestamp===b.timestamp && a.lat===b.lat && a.lon===b.lon;
    }
    function uniqueHistory(items){
      const out=[];
      for(const item of items){
        if(!validPosition(item)||out.some(x=>sameRecord(x,item)))continue;
        out.push(item);
        if(out.length===HISTORY_LIMIT)break;
      }
      return out;
    }
    try{
      const raw=localStorage.getItem(HISTORY_KEY),items=raw?JSON.parse(raw):[];
      history=uniqueHistory(Array.isArray(items)?items:[]);
    }catch(_){history=[];}


    try{
      const raw=localStorage.getItem(KEY);
      if(raw){
        const v=JSON.parse(raw);
        if(validPosition(v)){
          saved=v;
          // Automatically include a previously saved pin when upgrading.
          history=uniqueHistory([saved,...history]);
        }
      }
    }catch(error){ $('message').textContent='Αδυναμία ανάγνωσης προηγούμενης θέσης.'; }

    function formatDate(ts){
      return new Intl.DateTimeFormat('el-GR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(ts));
    }


    function formatCoordinates(record){
      return record.lat.toFixed(5)+', '+record.lon.toFixed(5);
    }
    function showMap(record){
      window.open('https://www.openstreetmap.org/?mlat='+encodeURIComponent(record.lat)+'&mlon='+encodeURIComponent(record.lon)+'#map=18/'+record.lat+'/'+record.lon,'_blank','noopener,noreferrer');
    }
    function navigateTo(record){
      window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(record.lat+','+record.lon),'_blank','noopener,noreferrer');
    }
    function renderHistory(){
      const panel=$('history-panel'),list=$('history-list');
      panel.hidden=history.length===0;
      panel.classList.toggle('is-collapsed',!historyExpanded);
      $('history-count').textContent=history.length+'/'+HISTORY_LIMIT;
      $('history-tile-count').textContent=history.length+'/'+HISTORY_LIMIT;
      $('history-toggle').disabled=history.length===0;
      $('history-toggle').setAttribute?.('aria-expanded',String(historyExpanded&&history.length>0));
      list.replaceChildren();
      for(const record of history){
        const card=document.createElement('article');
        card.className='parking-history-item'+(sameRecord(saved,record)?' is-current':'');
        const head=document.createElement('div');
        head.className='parking-history-head';
        const when=document.createElement('strong');
        when.className='parking-history-date';when.textContent=formatDate(record.timestamp);
        head.appendChild(when);
        if(sameRecord(saved,record)){
          const active=document.createElement('span');
          active.className='parking-history-active';active.textContent='✓ Τρέχουσα';
          head.appendChild(active);
        }
        const place=document.createElement('div');
        place.className='parking-history-place';
        place.textContent=record.address?.replace(/^(Πιθανή οδός:|Κοντά:)\s*/,'') || 'Αποθηκευμένη θέση';
        const coords=document.createElement('div');
        coords.className='parking-history-coords';coords.textContent=formatCoordinates(record);
        const actions=document.createElement('div');
        actions.className='parking-history-actions';
        const map=document.createElement('button');
        map.type='button';map.textContent='🗺️ Χάρτης';
        map.addEventListener('click',()=>showMap(record));
        const nav=document.createElement('button');
        nav.type='button';nav.textContent='➤ Πλοήγηση';
        nav.addEventListener('click',()=>navigateTo(record));
        actions.append(map,nav);
        card.append(head,place,coords,actions);
        list.appendChild(card);
      }
    }
    function persistNewPosition(value){
      // Save the history first: an unavailable storage quota cannot erase the old pin.
      const next=uniqueHistory([value,...history]);
      const previousRaw=localStorage.getItem(HISTORY_KEY);
      localStorage.setItem(HISTORY_KEY,JSON.stringify(next));
      try{localStorage.setItem(KEY,JSON.stringify(value));}
      catch(error){
        try{
          if(previousRaw===null)localStorage.removeItem(HISTORY_KEY);
          else localStorage.setItem(HISTORY_KEY,previousRaw);
        }catch(_){}
        throw error;
      }
      history=next;
      saved=value;
    }

    function stillCurrent(record){
      return saved && saved.timestamp===record.timestamp && saved.lat===record.lat && saved.lon===record.lon;
    }

    function streetLabel(road,house,city,record){
      if(!road) return '';
      const precise=Number.isFinite(record.accuracy) && record.accuracy<=40;
      return road + (precise && house ? ' ' + house : '') + (city ? ', ' + city : '');
    }

    function photonLabel(data,record){
      const features=Array.isArray(data?.features)?data.features:[];
      const match=features.find(f=>f?.properties && typeof f.properties.street==='string' && f.properties.street.trim()) ||
                  features.find(f=>f?.properties?.osm_key==='highway' && typeof f.properties.name==='string' && f.properties.name.trim());
      const p=match?.properties || {};
      const road=String(p.street || (p.osm_key==='highway' ? p.name : '') || '').trim();
      return streetLabel(road,String(p.housenumber||'').trim(),String(p.city||p.locality||p.district||'').trim(),record);
    }

    function nominatimLabel(data,record){
      const a=data?.address || {};
      const road=String(a.road||a.pedestrian||a.residential||a.living_street||a.footway||a.path||'').trim();
      return streetLabel(road,String(a.house_number||'').trim(),String(a.city||a.town||a.village||a.municipality||'').trim(),record);
    }

    async function requestJson(url,timeout=9000){
      const controller=new AbortController();
      const timer=setTimeout(()=>controller.abort(),timeout);
      try{
        const response=await fetch(url,{signal:controller.signal,cache:'no-store'});
        if(!response.ok) throw new Error('HTTP ' + response.status);
        return await response.json();
      }finally{ clearTimeout(timer); }
    }

    function setBigProgress(value){
      const deg=Math.max(0,Math.min(1,value))*360;
      $('big-progress').style.background=`conic-gradient(#44c6ff ${deg}deg, rgba(74,123,191,.22) ${deg}deg)`;
    }

    function render(){
      $('route-to-car').disabled = !saved;
      refreshMap();
      const unresolved = !!saved && !saved.address;
      $('retry').classList.toggle('show', !!saved && saved.addressLookedUp && unresolved);
      $('retry').disabled = lookingUp;
      document.querySelector('.status-chip').classList.toggle('empty', !saved);
      document.querySelector('.status-chip .check').textContent = saved ? '✓' : '○';

      if(saved){
        $('status').textContent='Αποθηκευμένη θέση';
        $('position').textContent = saved.address?.replace(/^(Πιθανή οδός:|Κοντά:)\s*/, '') || (lookingUp ? 'Εύρεση οδού…' : (saved.addressLookedUp ? 'Άγνωστη οδός' : 'Η θέση έχει αποθηκευτεί'));
        $('date').textContent = formatDate(saved.timestamp);
      }else{
        $('status').textContent='Δεν υπάρχει αποθηκευμένη θέση';
        $('position').textContent='Πάτησε «Αποθήκευση θέσης». ';
        $('date').textContent='—';
      }
      renderHistory();
    }

    async function resolveAddress(record){
      if(!record || record.addressLookedUp || lookingUp) return;
      if(!navigator.onLine){ $('message').textContent='Χωρίς internet — η θέση έχει αποθηκευτεί.'; return; }
      lookingUp=true; render();
      $('message').textContent='Αναζήτηση οδού…';
      let address='';
      try{
        const url='https://photon.komoot.io/reverse?lat='+encodeURIComponent(record.lat)+'&lon='+encodeURIComponent(record.lon)+'&lang=el&limit=5';
        address = photonLabel(await requestJson(url,8000),record);
      }catch(error){}
      if(!address){
        try{
          const url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&zoom=18&accept-language=el&lat='+encodeURIComponent(record.lat)+'&lon='+encodeURIComponent(record.lon);
          address = nominatimLabel(await requestJson(url,10000),record);
        }catch(error){}
      }
      lookingUp=false;
      if(stillCurrent(record)){
        saved.address=address;
        saved.addressLookedUp=true;
        try{ localStorage.setItem(KEY, JSON.stringify(saved)); }catch(error){}
        history=history.map(item=>sameRecord(item,record)?{...item,address,addressLookedUp:true}:item);
        try{ localStorage.setItem(HISTORY_KEY,JSON.stringify(history)); }catch(error){}
        render();
        $('message').textContent = address ? '' : 'Δεν βρέθηκε οδός — δοκίμασε ξανά.';
      }else if(saved && !saved.addressLookedUp){
        resolveAddress(saved);
      }
    }

    render();
    initMap();
    if(saved && !saved.addressLookedUp) resolveAddress(saved);

    $('retry').addEventListener('click',()=>{
      if(!saved || lookingUp) return;
      saved.addressLookedUp=false;
      $('message').textContent='';
      resolveAddress(saved);
    });

    $('save').addEventListener('click',()=>{
      if(!isSecureContext){ $('capture-status').textContent='Το GPS απαιτεί HTTPS.'; return; }
      if(!navigator.geolocation){ $('capture-status').textContent='Δεν υποστηρίζεται το GPS.'; return; }

      const saveButton=$('save');
      const saveLabel=$('save-label');
      const bigProgress=$('big-progress');
      const bigSeconds=$('big-seconds');
      const progressLabel=$('progress-label');
      let best=null, finished=false, watchId=null, timer=null, animationId=null;
      const duration=5000;
      const start=performance.now();

      saveButton.disabled=true;
      saveLabel.textContent='Εντοπισμός…';
      $('capture-status').textContent='';
      $('message').textContent='';
      progressLabel.textContent='Καταγραφή θέσης σε 5 δευτερόλεπτα…';
      bigProgress.hidden=false;
      $('progress-block').classList.remove('idle');
      setBigProgress(0);
      bigSeconds.textContent='5';

      function animate(now){
        if(finished) return;
        const elapsed=Math.max(0,Math.min(duration, now-start));
        const ratio=elapsed/duration;
        const remaining=Math.max(1, Math.ceil((duration-elapsed)/1000));
        setBigProgress(ratio);
        bigSeconds.textContent = String(remaining);
        animationId=requestAnimationFrame(animate);
      }
      animationId=requestAnimationFrame(animate);

      function stop(){
        if(finished) return false;
        finished=true;
        clearTimeout(timer);
        cancelAnimationFrame(animationId);
        if(watchId!==null) navigator.geolocation.clearWatch(watchId);
        saveButton.disabled=false;
        saveLabel.textContent='Αποθήκευση θέσης';
        bigProgress.hidden=true;
        $('progress-block').classList.add('idle');
        progressLabel.textContent='';
        setTimeout(checkPendingBuild,300);
        return true;
      }

      function finish(){
        if(!stop()) return;
        if(!best){
          $('capture-status').textContent='Δεν βρέθηκε θέση. Η προηγούμενη παραμένει.';
          return;
        }
        const value={lat:best.lat,lon:best.lon,accuracy:best.accuracy,timestamp:Date.now(),address:'',addressLookedUp:false};
        try{
          persistNewPosition(value);
          if(liveMap)liveMap._shownBoth=false;
          render();
          $('capture-status').textContent='✓ Αποθηκεύτηκε — μπορείς να κλειδώσεις.';
          resolveAddress(value);
        }catch(error){
          $('capture-status').textContent='Η αποθήκευση απέτυχε.';
        }
      }

      timer=setTimeout(finish,duration);
      try{
        watchId=navigator.geolocation.watchPosition(
          position=>{
            if(finished) return;
            const c=position.coords;
            if(!Number.isFinite(c.latitude)||!Number.isFinite(c.longitude)||Math.abs(c.latitude)>90||Math.abs(c.longitude)>180) return;
            const accuracy=Number.isFinite(c.accuracy) ? c.accuracy : null;
            const candidate={lat:c.latitude,lon:c.longitude,accuracy};
            if(!best || (accuracy!==null && (best.accuracy===null || accuracy<best.accuracy))) best=candidate;
            if(accuracy!==null && accuracy<=35) finish();
          },
          error=>{
            if(finished) return;
            if(error.code===1 && stop()) $('capture-status').textContent='Δεν δόθηκε άδεια τοποθεσίας.';
          },
          {enableHighAccuracy:true, timeout:5000, maximumAge:10000}
        );
        if(finished && watchId!==null) navigator.geolocation.clearWatch(watchId);
      }catch(error){
        if(stop()) $('capture-status').textContent='Δεν ήταν δυνατή η λήψη GPS.';
      }
    });

    $('history-toggle').addEventListener('click',()=>{
      if(!history.length)return;
      historyExpanded=!historyExpanded;
      renderHistory();
      if(historyExpanded)$('history-panel').scrollIntoView?.({behavior:'smooth',block:'nearest'});
    });


    /* Mobile PWA updates: detect a newer build when opening or resuming the app.
       Refresh only the app shell; never clear localStorage or saved parking pins. */
    let versionCheckBusy=false, pendingBuild='', lastResumeCheck=0;
    async function checkForNewBuild(){
      if(versionCheckBusy)return;
      versionCheckBusy=true;
      try{
        const url='./version.json?check='+Date.now();
        const response=await fetch(url,{cache:'no-store'});
        if(!response.ok)return;
        const current=await response.json();
        const next=current?.build;
        if(typeof next!=='string'||!/^parking-v[0-9]{1,5}$/.test(next)||next===APP_BUILD)return;
        if($('save').disabled){pendingBuild=next;return;}
        // A single automatic navigation per build prevents reload loops when offline.
        if(sessionStorage.getItem('parking.reloadedForBuild')===next)return;
        sessionStorage.setItem('parking.reloadedForBuild',next);
        window.location.replace('./?version='+encodeURIComponent(next));
      }catch(error){
        // Offline use is supported: keep the current shell and all saved positions.
      }finally{versionCheckBusy=false}
    }
    function checkPendingBuild(){
      if(pendingBuild&&!$('save').disabled){
        pendingBuild='';
        checkForNewBuild();
      }
    }
    if('serviceWorker' in navigator){
      async function refreshAppShell(){
        try{
          const registration=await navigator.serviceWorker.getRegistration('./');
          if(registration)await registration.update();
        }catch(error){}
        await checkForNewBuild();
      }
      window.addEventListener('load',async()=>{
        try{
          const registration=await navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'});
          await registration.update();
        }catch(error){}
        await checkForNewBuild();
      });
      document.addEventListener('visibilitychange',()=>{
        if(document.visibilityState==='visible')refreshAppShell();
      });
      window.addEventListener('pageshow',event=>{
        if(event.persisted)refreshAppShell();
      });
      window.addEventListener('focus',()=>{
        if(Date.now()-lastResumeCheck<30000)return;
        lastResumeCheck=Date.now();
        refreshAppShell();
      });
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        checkForNewBuild();
      });
    }
  })();
  </script>
</body>
</html>
