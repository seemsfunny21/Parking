<!doctype html><html lang="el"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b2b"><meta name="description" content="Τοπική αποθήκευση θέσης στάθμευσης"><link rel="manifest" href="./manifest.webmanifest"><title>Το Πάρκινγκ μου</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101b2b;color:#f7fafc}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.app{width:min(100%,480px)}header{text-align:center;margin-bottom:24px}h1{font-size:1.8rem;margin:12px 0 4px}header p,.muted{color:#aab9ce}.panel{background:#1a2a40;border:1px solid #31445e;border-radius:20px;padding:24px;text-align:center}.status{display:inline-block;background:#27445d;border-radius:30px;padding:7px 14px;font-size:.9rem;margin-bottom:14px}.position{font-size:1.12rem;font-weight:700;overflow-wrap:anywhere}.date,.accuracy{font-size:.9rem;color:#b6c6d9;margin-top:8px}.actions{display:grid;gap:12px;margin-top:18px}button{cursor:pointer;width:100%;padding:17px;border:0;border-radius:14px;font-weight:750;font-size:1rem;color:white;background:#2673ed}button.secondary{background:#253e5b;border:1px solid #48617d}button:disabled{opacity:.5;cursor:not-allowed}.note{font-size:.82rem;color:#aab9ce;text-align:center;line-height:1.6;margin-top:22px}#message{min-height:2.5em;color:#d9e8fa;text-align:center;font-size:.9rem;margin-top:12px}</style></head><body><main class="app"><header><div aria-hidden="true" style="font-size:3rem">🚗</div><h1>Το Πάρκινγκ μου</h1><p>Βρες εύκολα πού άφησες το αυτοκίνητο</p></header><section class="panel" aria-live="polite"><div class="status" id="status">Δεν υπάρχει αποθηκευμένη θέση</div><div class="position" id="position">Πάτησε «Αποθήκευση θέσης» όταν παρκάρεις.</div><div class="date" id="date"></div><div class="accuracy" id="accuracy"></div></section><div class="actions"><button id="save">📍 Αποθήκευση θέσης</button><button class="secondary" id="map" disabled>🗺️ Προβολή χάρτη</button><button class="secondary" id="navigate" disabled>➤ Πλοήγηση στο αυτοκίνητο</button></div><div id="message" role="status" aria-live="polite"></div><p class="note">Η θέση αποθηκεύεται μόνο σε αυτόν τον browser. Η προβολή χάρτη και η πλοήγηση ανοίγουν εξωτερική υπηρεσία και ενδέχεται να χρησιμοποιούν δεδομένα.</p></main><script>(()=>{'use strict';const KEY='parking.saved.v1',$=id=>document.getElementById(id);let saved=null;try{const raw=localStorage.getItem(KEY);if(raw){const v=JSON.parse(raw);if(Number.isFinite(v.lat)&&Number.isFinite(v.lon)&&Number.isFinite(v.timestamp)&&Math.abs(v.lat)<=90&&Math.abs(v.lon)<=180)saved=v}}catch(e){$('message').textContent='Αδυναμία ανάγνωσης προηγούμενης θέσης.'}function render(){$('map').disabled=$('navigate').disabled=!saved;if(saved){$('status').textContent='✓ Αποθηκευμένη θέση';$('position').textContent=saved.lat.toFixed(6)+', '+saved.lon.toFixed(6);$('date').textContent=new Intl.DateTimeFormat('el-GR',{dateStyle:'medium',timeStyle:'short'}).format(new Date(saved.timestamp));$('accuracy').textContent=Number.isFinite(saved.accuracy)?'Ακρίβεια: περίπου ±'+Math.round(saved.accuracy)+' μ.':''}else{$('status').textContent='Δεν υπάρχει αποθηκευμένη θέση';$('position').textContent='Πάτησε «Αποθήκευση θέσης» όταν παρκάρεις.';$('date').textContent='';$('accuracy').textContent=''}}render();$('save').addEventListener('click',()=>{if(!isSecureContext){$('message').textContent='Το GPS απαιτεί HTTPS.';return}if(!navigator.geolocation){$('message').textContent='Η τοποθεσία δεν υποστηρίζεται.';return}const b=$('save');b.disabled=true;b.textContent='Εντοπισμός θέσης…';$('message').textContent='Επίτρεψε την πρόσβαση στην τοποθεσία αν ζητηθεί.';navigator.geolocation.getCurrentPosition(p=>{b.disabled=false;b.textContent='📍 Αποθήκευση θέσης';const {latitude:lat,longitude:lon,accuracy}=p.coords;if(!Number.isFinite(lat)||!Number.isFinite(lon)){ $('message').textContent='Μη έγκυρη θέση.';return}const value={lat,lon,accuracy,timestamp:Date.now()};try{localStorage.setItem(KEY,JSON.stringify(value));saved=value;render();$('message').textContent='Η θέση αποθηκεύτηκε στο κινητό.'}catch(e){$('message').textContent='Η τοπική αποθήκευση απέτυχε.'}},e=>{b.disabled=false;b.textContent='📍 Αποθήκευση θέσης';$('message').textContent=({1:'Δεν δόθηκε άδεια τοποθεσίας.',2:'Δεν βρέθηκε η τοποθεσία.',3:'Ο εντοπισμός άργησε πολύ.'})[e.code]||'Αποτυχία εντοπισμού.'},{enableHighAccuracy:true,timeout:20000,maximumAge:0})});$('map').addEventListener('click',()=>{if(!saved)return;const {lat,lon}=saved;window.open('https://www.openstreetmap.org/?mlat='+encodeURIComponent(lat)+'&mlon='+encodeURIComponent(lon)+'#map=18/'+lat+'/'+lon,'_blank','noopener,noreferrer')});$('navigate').addEventListener('click',()=>{if(!saved)return;window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(saved.lat+','+saved.lon),'_blank','noopener,noreferrer')});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))})();</script></body></html>
